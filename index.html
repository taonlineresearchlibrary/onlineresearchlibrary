<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORL</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:white;
    color:black;
}

header{
    text-align:center;
    padding:30px;
    border-bottom:2px solid black;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.home{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
    flex-wrap:wrap;
}

.btn{
    width:220px;
    height:120px;
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    cursor:pointer;
}

.btn:hover{
    background:#f5f5f5;
}

.page{
    display:none;
}

.active{
    display:block;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

.article{
    border:1px solid black;
    padding:15px;
    margin-top:10px;
    cursor:pointer;
}

.article:hover{
    background:#f7f7f7;
}

button{
    padding:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>ORL (Online Research Library)</h1>
</header>

<div class="container">

<div id="home" class="page active">

    <div class="home">

        <div class="btn"
        onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSfgV1BG2a-y93Y6jIbJLc5KeOAkMmkpehbUDXc-eCaq01d04w/viewform?usp=header','_blank')">
            글쓰기
        </div>

        <div class="btn"
        onclick="openSearch()">
            검색하기
        </div>

    </div>

</div>

<div id="search" class="page">

    <button onclick="showPage('home')">
        홈으로
    </button>

    <h2>연구자료 검색</h2>

    <input
        id="searchBox"
        type="text"
        placeholder="제목 검색"
        onkeyup="filterArticles()"
    >

    <div id="articleList">
        불러오는 중...
    </div>

</div>

<div id="article" class="page">

    <button onclick="showPage('search')">
        뒤로가기
    </button>

    <h2 id="viewTitle"></h2>

    <p id="viewTime"></p>

    <hr>

    <div id="viewContent"></div>

</div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzSKldXiHZyNjBRxz0FVvuf_Y5pN_mISB5TXNnBe21FRezktCEWF1gzU7uPN0CDWfc/exec";

let articles = [];

function showPage(id){
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

async function loadArticles(){

    try{

        const response = await fetch(API_URL);
        articles = await response.json();

        renderArticles(articles);

    }catch(error){

        document.getElementById("articleList").innerHTML =
        "자료를 불러오지 못했습니다.";

        console.error(error);
    }
}

function renderArticles(list){

    const articleList =
    document.getElementById("articleList");

    articleList.innerHTML = "";

    if(list.length === 0){

        articleList.innerHTML =
        "등록된 연구자료가 없습니다.";

        return;
    }

    [...list].reverse().forEach(article=>{

        const div =
        document.createElement("div");

        div.className = "article";

        div.innerHTML =
        "<strong>" + article.title + "</strong>";

        div.onclick = ()=>{
            openArticle(article);
        };

        articleList.appendChild(div);

    });

}

function filterArticles(){

    const keyword =
    document.getElementById("searchBox")
    .value
    .toLowerCase();

    const filtered =
    articles.filter(article =>
        (article.title || "")
        .toLowerCase()
        .includes(keyword)
    );

    renderArticles(filtered);

}

function openSearch(){

    showPage("search");
    loadArticles();

}

function openArticle(article){

    document.getElementById("viewTitle")
    .textContent =
    article.title || "";

    document.getElementById("viewTime")
    .textContent =
    "작성시간: " + (article.time || "");

    document.getElementById("viewContent")
    .textContent =
    article.content || "";

    showPage("article");

}

</script>

</body>
</html>
