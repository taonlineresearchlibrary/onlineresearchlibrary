<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORL</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:white;
    color:black;
}

header{
    text-align:center;
    padding:30px;
    border-bottom:2px solid black;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.home{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:40px;
}

.btn{
    width:220px;
    height:120px;
    border:2px solid black;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    cursor:pointer;
}

.page{
    display:none;
}

.active{
    display:block;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

.article{
    border:1px solid black;
    padding:10px;
    margin-top:10px;
    cursor:pointer;
}

.article:hover{
    background:#f0f0f0;
}
</style>

</head>

<body>

<header>
    <h1>ORL (Online Research Library)</h1>
</header>

<div class="container">

```
<div id="home" class="page active">

    <div class="home">

        <div class="btn"
             onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSc-pyzWNAWTTKNqrLbYGiiLVgoTBLEACLYkUvgvCpmQqh34CA/viewform?usp=header','_blank')">
            글쓰기
        </div>

        <div class="btn"
             onclick="openSearch()">
            검색하기
        </div>

    </div>

</div>

<div id="search" class="page">

    <button onclick="showPage('home')">
        홈으로
    </button>

    <h2>연구자료 검색</h2>

    <input
        type="text"
        placeholder="검색 기능은 추후 추가 예정"
    >

    <div id="articleList">
        불러오는 중...
    </div>

</div>

<div id="article" class="page">

    <button onclick="showPage('search')">
        뒤로가기
    </button>

    <h2 id="viewTitle"></h2>

    <p id="viewAuthor"></p>

    <p id="viewTime"></p>

    <hr>

    <p id="viewContent"></p>

</div>
```

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxswEfEGLPNFPteAfnA9a0gt96j45cR-x1HQxI7ol9kj-BdfHWE4bn9q5RGoODmMg-8/exec";

let articles = [];

function showPage(id){

    document.querySelectorAll('.page').forEach(page=>{
        page.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');
}

async function loadArticles(){

    const response = await fetch(API_URL);
    articles = await response.json();

    const list = document.getElementById("articleList");

    list.innerHTML = "";

    if(articles.length===0){
        list.innerHTML = "등록된 연구자료가 없습니다.";
        return;
    }

    articles.reverse().forEach((article,index)=>{

        const div = document.createElement("div");

        div.className = "article";

        div.innerHTML =
        "<strong>" + article.title + "</strong><br>" +
        "작성자: " + article.author;

        div.onclick = ()=>{
            openArticle(article);
        };

        list.appendChild(div);
    });
}

function openSearch(){

    showPage("search");
    loadArticles();
}

function openArticle(article){

    document.getElementById("viewTitle").textContent =
        article.title;

    document.getElementById("viewAuthor").textContent =
        "작성자: " + article.author;

    document.getElementById("viewTime").textContent =
        "작성시간: " + article.time;

    document.getElementById("viewContent").textContent =
        article.content;

    showPage("article");
}

</script>

</body>
</html>
